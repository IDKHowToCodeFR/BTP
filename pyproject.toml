[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-cloud-selection"
version = "0.1.0"
description = "Agentic cloud service selection: LLM-inferred weights and strategy selection over classical MCDM baselines"
requires-python = ">=3.9"
readme = "README.md"
dependencies = [
    "pandas>=1.5",
    "numpy>=1.23",
    "requests>=2.28",
    "scipy>=1.9",
    "matplotlib>=3.6",
    "pyyaml>=6.0",
    "tqdm>=4.65",
    "streamlit>=1.32",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.30"]
openai = ["openai>=1.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
